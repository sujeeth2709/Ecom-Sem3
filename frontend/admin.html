<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin · CartLedger</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="admin-shell">
  <div class="admin-side">
    <div class="brand">CartLedger</div>
    <a class="active" href="#">Dashboard</a>
    <a href="profile.html">Profile</a>
    <a href="#" onclick="logout()">Log out</a>
    <p class="muted" style="margin-top:30px;">Signed in as<br><b id="who" style="color:#fff;"></b></p>
  </div>

  <div class="admin-main">
    <h2>Admin dashboard</h2>
    <div class="stat-row">
      <div class="stat"><div class="num" id="stat-products">0</div><div class="lbl">Products</div></div>
      <div class="stat"><div class="num" id="stat-orders">0</div><div class="lbl">Orders</div></div>
      <div class="stat"><div class="num" id="stat-lowstock">0</div><div class="lbl">Low stock (&lt;15)</div></div>
      <div class="stat"><div class="num" id="stat-revenue">₹0</div><div class="lbl">Revenue</div></div>
    </div>

    <div class="section-title"><h3>Product catalog & inventory</h3></div>
    <div class="card">
      <table>
        <thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead>
        <tbody id="admin-products"></tbody>
      </table>
    </div>

    <div class="section-title"><h3>Add new product</h3></div>
    <div class="card">
      <form id="add-product-form" class="grid" style="grid-template-columns:2fr 1fr 1fr 1fr 1.5fr auto;align-items:end;gap:12px;">
        <div><label>Name</label><input id="np-name" required></div>
        <div><label>Category</label>
          <select id="np-cat">
            <option>Electronics</option><option>Fashion</option>
            <option>Home & Kitchen</option><option>Books</option>
          </select>
        </div>
        <div><label>Price (₹)</label><input id="np-price" type="number" min="1" required></div>
        <div><label>Stock</label><input id="np-stock" type="number" min="0" required></div>
        <div><label>Picture</label><input id="np-image" type="file" accept="image/*"></div>
        <button class="btn">Add</button>
      </form>
    </div>

    <div class="section-title"><h3>Orders & payments</h3></div>
    <div class="card">
      <table>
        <thead><tr><th>Order</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th></tr></thead>
        <tbody id="admin-orders"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="js/script.js"></script>
<script>initAdminPage();</script>
</body>
</html>
